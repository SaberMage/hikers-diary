# traceable-reqs manifest for Hikers' Diary.
#
# Authoritative requirement registry: every requirement and every KNOWN-HAZARDS
# invariant lives here as a REQ-* id (see docs/TRACEABILITY.md for the full contract).
#
# ACQUIRE the CLI (it is a released binary, not a crate dependency):
#   gh release download --repo BigscreenVR/traceable-reqs \
#     --pattern '*windows*.exe' --output traceable-reqs.exe
# Validate this manifest against the installed CLI: `traceable-reqs check`.
#
# THE FOUR-STAGE CONTRACT: every requirement is traced from
#   doc  (prose/design)  ->  impl (production code)  ->  unit (unit test)  ->  int (cross-process/node)
# Tag evidence in the SAME commit, on/above the real evidence:
#   // [impl->REQ-FOO]   // [unit->REQ-FOO]   <!-- [doc->REQ-FOO] -->
#
# ACTIVATION MODEL: every requirement starts inactive (`required_stages = []`) so `check`
# stays green pre-code. A milestone ACTIVATES its requirements by setting their real
# `required_stages` when work on them begins. Deferred items stay [] until promoted.

[scan]
# Every evidence location. A missing root makes evidence SILENTLY vanish from the trace.
roots = ["src", "tests", "docs", "scripts", "CONTEXT.md", "README.md", "M1-PLAN.md", "M2-PLAN.md"]

[scan.extensions]
# C# is not a built-in scanner language; without this mapping every .cs tag silently vanishes.
".cs" = "c_like"

[policy]
required_stages = []

# ───────────────────────────── Requirements ─────────────────────────────────

[[requirements]]
id = "REQ-HAZARD-UNKNOWN-BUILD"
title = "On a game build that is not a Known Build, the mod installs no hooks and logs one line"
required_stages = ["doc", "impl", "unit"]

[[requirements]]
id = "REQ-BODY-SPIKE"
title = "The host saves each body of a player who left, and spawns it again after a game load (#1)"
required_stages = ["doc", "impl", "unit"]

[[requirements]]
id = "REQ-DIARY-SAVE"
title = "The host keeps one versioned Diary save for each game slot, writes it atomically at an interval and when the host stops, never overwrites a file that it cannot read, and restores it after a game load (#2)"
required_stages = ["doc", "impl", "unit"]

[[requirements]]
id = "REQ-PROP-POSE"
title = "The host saves the position and the rotation of each loose prop, finds it again by savablePropGuid, then sceneId, then a unique GameObject path, and puts it back after a game load (#3)"
required_stages = ["doc", "impl", "unit"]

[[requirements]]
id = "REQ-VEHICLE-STATE"
title = "The host saves the state of each NetworkedTrain and each MovementDriver, and the loaded cars of each NetworkedTrain. It finds each one again by its unique GameObject path. After a game load, it sets the saved state again and keeps each loaded car loaded until something touches it (#4)"
required_stages = ["doc", "impl", "unit"]

[[requirements]]
id = "REQ-PLATFORM-PROPS"
title = "The host saves the position of each prop, body and player on a moving platform relative to its platform. After a game load, the host sets each NetworkedTrain and each MovementDriver first and loads again each car that is necessary. Then it moves each prop and body to its saved position on its platform. Then it moves the player to its saved position (#4)"
required_stages = ["doc", "impl", "unit"]

[[requirements]]
id = "REQ-TIME-OF-DAY"
title = "The host saves the Enviro date and time. After a game load, it sets them again (#4)"
required_stages = ["doc", "impl", "unit"]

[[requirements]]
id = "REQ-PLAYER-COLORS"
title = "The host keeps one color set for each player in a file that all saves share. When a color changes, the host writes it to that file. When the game loads a save, the host gives each player the colors from that file (#6)"
required_stages = ["doc", "impl", "unit"]

[[requirements]]
id = "REQ-PLAYER-STATE"
title = "The host saves the position, facing, pose, held item and equipped items of its own player, and the items of each body. After a game load, it sets them again (#5)"
required_stages = ["doc", "impl", "unit"]

[[requirements]]
id = "REQ-GAME-START"
title = "At the first screen, the host loads the latest save behind it. The first screen stays white on black, and the game input controls it. The local player starts in the drowsy view without the snore. The black image becomes transparent while the intro music decreases to zero. Then the continue button starts the gameplay (#13)"
required_stages = ["doc", "impl", "unit"]

[[requirements]]
id = "REQ-SAVE-SWITCH"
title = "A player sits and types a new: or goto: command in the chat. The sleep timeout becomes shorter. When the player sleeps, the view and the audio decrease to zero. Then the target save loads. The view and the audio increase again, and the player wakes at the saved pose (#14)"
required_stages = ["doc", "impl", "unit"]

[[requirements]]
id = "REQ-CHAT-COMMAND"
title = "The mod parses the new: and goto: chat commands. Other chat text starts a switch only if it is a definite match to the title of one local save. Other chat text never starts a switch (#14, rule 2)"
required_stages = ["doc", "impl", "unit"]

[[requirements]]
id = "REQ-FRIEND-JOIN"
title = "A goto: command with the title of a friend session or a session ID joins that session, with the password of the command or the most recent password. If the session is not there or the join fails, and the command has no password, the local copy loads. If there is no local copy, the player wakes and stands before the fade-out is complete (#14)"
required_stages = ["doc", "impl", "unit"]
